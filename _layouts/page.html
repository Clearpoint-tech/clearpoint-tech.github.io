---
layout: default
---
<article class="page{% if page.page_class %} {{ page.page_class }}{% endif %}">
  <header class="page-intro">
    <div class="container">
      {%- if page.back_url %}
      <p class="page-intro__back"><a href="{{ page.back_url }}">← {{ page.back_label }}</a></p>
      {%- endif %}
      {%- if page.kicker %}
      <p class="kicker">{{ page.kicker }}</p>
      {%- endif %}
      <h1>{{ page.heading | default: page.title }}</h1>
      {%- if page.lead %}
      <p class="lead">{{ page.lead }}</p>
      {%- endif %}
    </div>
  </header>

  <div class="page-body{% if page.prose != false %} container prose{% endif %}">
    {{ content }}
  </div>
</article>
