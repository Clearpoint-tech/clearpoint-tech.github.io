# Clearpoint site configuration.
#
# This file is *NOT* reloaded automatically by `bundle exec jekyll serve`.
# Restart the server after editing it.

title: Clearpoint
email: contact@clearpoint.ch
description: Cybersecurity, AI agents and automation, and technical project delivery for Swiss SMEs and growing organisations.
logo: /assets/logo/clearpoint_logo.svg
lang: en
locale: en_US

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://clearpoint.ch" # the base hostname & protocol for your site

# Shared links used by layouts and pages.
booking_url: "https://calendar.app.google/vsrnZMvv2QyYiyjH6"
linkedin_url: "https://www.linkedin.com/in/philip-ritter"
author: Philip Ritter

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Retired or external URLs that only redirect. Collection documents are not
# part of site.pages, so they never appear in the sitemap.
collections:
  redirects:
    output: true

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
